name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Build do projeto
        run: npm run build

      - name: Rodar testes unitários
        run: npx vitest run

      - name: Rodar testes E2E do Playwright
        run: npm run test:e2e

      - name: Rodar teste de API REST Assured
        run: |
          npm run server > /tmp/trihbau-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          until curl --fail --silent http://localhost:3001/health > /dev/null; do sleep 1; done
          npm run test:api-java
